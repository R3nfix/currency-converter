<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="currency-converter container">
        <h2 class="currency-converter__header">
            Конвертер валют
        </h2>

        <div class="currency-converter__input-container">
            <div class="currency-converter__error hide" data-js-error-message>Пожалуйста, введите сумму</div>
            <input type="number" class="" data-js-amount placeholder="Введите сумму...">

            <select name="fromCurrency" data-js-from-currency>
                <option value="USD">USD — Доллар США</option>
                <option value="EUR">EUR — Евро</option>
                <option value="GBP">GBP — Фунт стерлингов</option>
                <option value="RUB">RUB — Российский рубль</option>
                <option value="TRY">TRY — Турецкая лира</option>
                <option value="CNY">CNY — Китайский юань</option>
                <option value="KZT">KZT — Казахстанский тенге</option>
            </select>

        </div>

        <div class="currency-converter__input-container">
            <input type="number" data-js-result placeholder="Результат конвертации" readonly>
    
            <select name="toCurrency" data-js-to-currency>
                <option value="USD">USD — Доллар США</option>
                <option value="EUR">EUR — Евро</option>
                <option value="GBP">GBP — Фунт стерлингов</option>
                <option value="RUB">RUB — Российский рубль</option>
                <option value="TRY">TRY — Турецкая лира</option>
                <option value="CNY">CNY — Китайский юань</option>
                <option value="KZT">KZT — Казахстанский тенге</option>
            </select>

            <div class="currency-converter__error-request hide" data-js-error-request-message>Не удалось обработать ваш запрос. Попробуйте ещё раз</div>
        </div>

        <button type="button" class="btn-conversion" data-js-btn-conversion>Конвертировать</button>
    </div>
</body>
</html>
