<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="currency__converter container">
        <h2 class="currency__converter-header">
            Конвертер валют
        </h2>

        <div class="container-input-first">
            <input type="number" data-js-amount placeholder="Введите сумму...">

            <select name="fromCurrency" data-js-from-currency>
                <option value="USD">USD — Доллар США</option>
                <option value="EUR">EUR — Евро</option>
                <option value="GBP">GBP — Фунт стерлингов</option>
                <option value="RUB">RUB — Российский рубль</option>
                <option value="TRY">TRY — Турецкая лира</option>
                <option value="CNY">CNY — Китайский юань</option>
                <option value="KZT">KZT — Казахстанский тенге</option>
            </select>

        </div>

        <div class="container-input-second">
            <input type="number" data-js-result placeholder="Результат конвертации" readonly>
    
            <select name="toCurrency" data-js-to-currency>
                <option value="USD">USD — Доллар США</option>
                <option value="EUR">EUR — Евро</option>
                <option value="GBP">GBP — Фунт стерлингов</option>
                <option value="RUB">RUB — Российский рубль</option>
                <option value="TRY">TRY — Турецкая лира</option>
                <option value="CNY">CNY — Китайский юань</option>
                <option value="KZT">KZT — Казахстанский тенге</option>
            </select>
        </div>

        <button type="button" class="btn__conversion" data-js-btn-conversion>Конвертировать</button>
    </div>
</body>
</html>
